# nginx site for the Unbound Daily API, admin panel and checkout page.
# Copy to /etc/nginx/sites-available/unbound, replace unbound.zonty.in with your
# domain, enable it, then run certbot (see docs/DEPLOY.md). Certbot adds the
# HTTPS server block and the HTTP -> HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name unbound.zonty.in;

    # JSON bodies are small; the API rejects anything bigger anyway.
    client_max_body_size 1m;

    gzip on;
    gzip_types application/json text/css application/javascript;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The app trusts one proxy hop, so rate limits see the real client IP.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }
}
