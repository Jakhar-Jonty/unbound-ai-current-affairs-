name: Backend

# Tests on every pull request and push to main. A push to main that passes
# deploys to the VPS (see docs/DEPLOY.md, step 10).
on:
  pull_request:
    paths-ignore: ['mobile/**', 'docs/**', '**.md']
  push:
    branches: [main]
    paths-ignore: ['mobile/**', 'docs/**', '**.md']
  workflow_dispatch: # "Run workflow" button: test and deploy main by hand

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
        env:
          MONGODB_URI_TEST: mongodb://127.0.0.1:27017

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://unbounddaily.zonty.in
    # One deploy at a time; a newer push waits instead of cancelling a deploy halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is locked to scripts/deploy.sh on the server, so no command is sent.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "deploy@$HOST"
      - name: Check the public site
        run: |
          for i in 1 2 3 4 5; do
            curl -fsS https://unbounddaily.zonty.in/health && exit 0
            sleep 5
          done
          exit 1
